name: Build PyBullet Results Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: pybullet-results-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run verification test suite
        run: |
          pytest tests/ -v

      - name: Run batch simulation release
        run: |
          python run/run_batch.py --duration 30.0 --serial

      - name: Verify results folder
        run: |
          pwd
          test -d results/pybullet
          ls -la results/pybullet

      - name: Package results
        run: |
          zip -r "results-${GITHUB_REF_NAME}.zip" results/pybullet

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ github.ref_name }}
          path: results-${{ github.ref_name }}.zip

      - name: Create GitHub release and upload results
        uses: softprops/action-gh-release@v2
        with:
          files: results-${{ github.ref_name }}.zip
