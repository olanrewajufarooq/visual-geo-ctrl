[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vgc"
version = "0.1.0"
description = "Nominal geometric control visualization in Python and PyBullet"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.18.0",
    "matplotlib>=3.10.0",
    "pybullet>=3.2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --basetemp=.pytest_tmp"
testpaths = ["tests"]
pythonpath = ["src"]
